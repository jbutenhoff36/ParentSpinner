# One-click deploy on Render (render.com): New > Blueprint > pick this repo.
services:
  - type: web
    name: good-spin-bad-spin
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build && npm run db:push -- --force
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_TIMEZONE
        value: America/Chicago
      - key: DATABASE_URL
        fromDatabase:
          name: good-spin-bad-spin-db
          property: connectionString
databases:
  - name: good-spin-bad-spin-db
    plan: free
