# One-click deploy on Render (render.com): New > Blueprint > pick this repo.
# The database lives on Neon (free, doesn't expire). Paste its connection string
# into DATABASE_URL in the Render dashboard (see README, "Put it online").
services:
  - type: web
    name: kidspin
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_TIMEZONE
        value: America/Chicago
      # Postgres connection string from Neon (neon.tech)
      - key: DATABASE_URL
        sync: false
      # Sign in with Google: paste these from Google Cloud Console (see README)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
